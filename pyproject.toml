[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-sparse-moe-reasoning"
version = "0.1.0"
description = "zkMoE-Reason: Sublinear Zero-Knowledge Proofs for Sparse Mixture-of-Experts and Hidden Test-Time Reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
